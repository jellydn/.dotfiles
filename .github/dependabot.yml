version: 2
updates:
  # Keep flake.lock inputs up to date (nixpkgs, home-manager, nix-darwin, dotfiles, etc.)
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nix"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
